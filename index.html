<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>After School Club</title>

    <!-- Load Vue 3 from the unpkg CDN -->
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>

    <!-- Load Font Awesome 4.7 for icons (as taught in Workshop 2) -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
</head>
<body>

    <!-- The HTML element where our Vue app will be mounted -->
    <div id="app">
        <header>
            <h1 v-text="sitename"></h1>

            <!-- Checkout / Shopping Cart button:
                 - Only enabled when there is at least 1 item in the cart
                 - Clicking toggles between the lesson page and the checkout page -->
            <button v-on:click="showCheckout" v-bind:disabled="numberOfItems === 0">
                <i class="fa fa-shopping-cart" aria-hidden="true"></i>
                Checkout ({{ numberOfItems }})
            </button>
        </header>

        <main>
            <!-- Lesson Page: only displayed when displayCart is false -->
            <div v-if="!displayCart">
                <figure>
                    <!-- Bind 'src' and 'alt' attributes to properties inside 'lesson' in data -->
                    <img v-bind:src="lesson.image" v-bind:alt="lesson.alt" width="100">
                </figure>

                <h2 v-text="lesson.subject"></h2>
                <p v-text="lesson.location"></p>
                <p>Price: £{{ lesson.price }}</p>
                <p>Spaces: {{ lesson.availability }}</p>

                <!-- Add to cart button: calls addToCart() when clicked, disabled when canAddToCart is false -->
                <button v-on:click="addToCart" v-bind:disabled="!canAddToCart">Add to cart</button>
            </div>

            <!-- Checkout / Cart Page placeholder: displayed when displayCart is true -->
            <div v-else>
                <h2>Checkout</h2>
            </div>
        </main>
    </div>

    <script type="module">
        const { createApp } = Vue

        const webstore = createApp({
            data() {
                return {
                    sitename: "After School Club",
                    displayCart: false,
                    lesson: {
                        id: 1001,
                        subject: "Math",
                        location: "London",
                        price: 100,
                        availability: 5,
                        image: "images/math.png",
                        alt: "Math lesson icon"
                    },
                    cart: []
                }
            },
            methods: {
                addToCart() {
                    this.cart.push(this.lesson.id);
                    this.lesson.availability -= 1;
                },
                showCheckout() {
                    this.displayCart = this.displayCart ? false : true;
                }
            },
            computed: {
                numberOfItems() {
                    return this.cart.length;
                },
                canAddToCart() {
                    return this.lesson.availability > 0;
                }
            }
        })

        webstore.mount('#app')
    </script>

</body>
</html>
