<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>After School Club</title>

    <!-- Load our lessons array -->
    <script src="lessons.js"></script>

    <!-- Load Font Awesome 4.7 for icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">

    <!-- Load Vue 3 from the unpkg CDN -->
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
</head>
<body>

    <div id="app">
        <header>
            <h1 v-text="sitename"></h1>

            <button v-on:click="showCheckout" v-bind:disabled="numberOfItems === 0">
                <i class="fa fa-shopping-cart" aria-hidden="true"></i>
                Checkout ({{ numberOfItems }})
            </button>
        </header>

        <main>
            <!-- Lessons Page: displayed when displayCart is false -->
            <div v-if="!displayCart">
                <!-- Use v-for to display all lessons from the lessons array -->
                <div v-for="lesson in lessons" style="border: 1px solid #ccc; padding: 10px; margin: 10px 0;">
                    <figure>
                        <img v-bind:src="lesson.image" v-bind:alt="lesson.alt" width="100">
                    </figure>

                    <h2>
                        <i v-bind:class="'fa ' + lesson.icon" aria-hidden="true"></i>
                        <span v-text="lesson.subject"></span>
                    </h2>
                    <p>Location: <span v-text="lesson.location"></span></p>
                    <p>Price: £{{ lesson.price }}</p>
                    <p>Spaces: {{ lesson.availability }}</p>

                    <button v-on:click="addToCart(lesson)" v-bind:disabled="!canAddToCart(lesson)">
                        Add to cart
                    </button>
                </div>
            </div>

            <!-- Checkout / Cart Page: displayed when displayCart is true -->
            <div v-else>
                <h2>Checkout</h2>
            </div>
        </main>
    </div>

    <script type="module">
        const { createApp } = Vue

        const webstore = createApp({
            data() {
                return {
                    sitename: "After School Club",
                    displayCart: false,
                    lessons: lessonsArray,
                    cart: []
                }
            },
            methods: {
                addToCart(lesson) {
                    this.cart.push(lesson.id);
                    lesson.availability -= 1;
                },
                canAddToCart(lesson) {
                    return lesson.availability > 0;
                },
                showCheckout() {
                    this.displayCart = this.displayCart ? false : true;
                }
            },
            computed: {
                numberOfItems() {
                    return this.cart.length;
                }
            }
        })

        webstore.mount('#app')
    </script>

</body>
</html>
